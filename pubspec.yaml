name: shorthand_sanitizer
description: Batch codemod for Dart 3.10 dot shorthands — rewrites Type.member to .member only where the analyzer proves it a no-op, prunes imports it orphans. Ships the dotsan CLI.
version: 0.6.0
homepage: https://mehmetesen.com
repository: https://github.com/esenmx/shorthand_sanitizer
issue_tracker: https://github.com/esenmx/shorthand_sanitizer/issues
documentation: https://pub.dev/documentation/shorthand_sanitizer/latest/

topics:
  - analyzer
  - code-style
  - static-analysis
  - cli
  - developer-tools

environment:
  sdk: ^3.10.0

executables:
  dotsan:

dependencies:
  analyzer: ^14.0.0
  args: ^2.7.0
  cli_util: ^0.5.2
  glob: ^2.1.3
  path: ^1.9.1

dev_dependencies:
  test: ^1.31.2
  very_good_analysis: ^10.2.0
